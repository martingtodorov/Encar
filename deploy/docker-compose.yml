# Europe Encar, whole stack, one command:
#
#   cd <repo root> && cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# `caddy` gets a real certificate for SITE_DOMAIN by itself. Leave it out with
# `--scale caddy=0` if you already have a proxy in front.
name: europe-encar

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
    # Not published: only the backend needs it.

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        WITH_PLAYWRIGHT: "${WITH_PLAYWRIGHT:-0}"
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        # Empty on purpose: the app calls /api on its own origin, which nginx proxies.
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  mongo-data:
  media:
  caddy-data:
  caddy-config:
