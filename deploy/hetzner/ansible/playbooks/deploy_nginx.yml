---
# nginx on the frontend host: serves the static build, proxies /api to the backend over the
# private network, terminates TLS with the Cloudflare Origin certificate.
#
#   ansible-playbook -i inventory.ini playbooks/deploy_nginx.yml -e "ref=main"
#
# Tags: base, config, firewall.
- name: nginx for Europe Encar
  hosts: frontend
  become: true

  pre_tasks:
    - name: Let any first-boot apt run finish first
      ansible.builtin.include_tasks: ../tasks/wait_apt.yml
      tags: [always]

  tasks:
    - name: nginx
      ansible.builtin.apt:
        name: nginx
        update_cache: true
        lock_timeout: 300
      tags: [base]

    - name: Certificate directory (the cert itself is dropped by hand, never by Ansible)
      ansible.builtin.file:
        path: "{{ ssl_dir }}"
        state: directory
        mode: "0700"
      tags: [base]

    - name: ACME webroot, in case Let's Encrypt is ever wanted
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        mode: "0755"
      tags: [base]

    - name: The Cloudflare Origin certificate must already be there
      ansible.builtin.stat:
        path: "{{ ssl_dir }}/{{ item }}"
      register: certs
      loop: [cert.pem, key.pem]
      tags: [config]

    - name: Say plainly what is missing
      ansible.builtin.assert:
        that: certs.results | map(attribute='stat.exists') | select | list | length == 2
        fail_msg: >-
          Put the Cloudflare Origin certificate on this host first:
          {{ ssl_dir }}/cert.pem and {{ ssl_dir }}/key.pem (chmod 600). Cloudflare dashboard
          -> SSL/TLS -> Origin Server -> Create Certificate. Ansible never writes secrets.
      tags: [config]

    - name: Backend name resolves over the private network
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\sencar-back1$'
        line: "{{ backend_private_ip }} encar-back1"
      tags: [config]

    - name: Which nginx this is
      # `http2 on;` only exists from 1.25.1; before that HTTP/2 is a `listen` parameter, and
      # an unknown directive is FATAL (`nginx -t` -> emerg). front1 runs the older one.
      ansible.builtin.command: nginx -v
      register: nginx_v
      changed_when: false
      tags: [config]

    - name: Remember which http2 syntax it understands
      ansible.builtin.set_fact:
        nginx_version: >-
          {{ (nginx_v.stderr ~ nginx_v.stdout) | regex_search('nginx/([0-9.]+)', '\1') | first }}
      tags: [config]

    - name: Site configuration
      ansible.builtin.template:
        src: ../templates/nginx-encar.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
        mode: "0644"
      notify: Reload nginx
      tags: [config]

    - name: Enable it
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ app_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
        state: link
      notify: Reload nginx
      tags: [config]

    - name: Drop the distro default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx
      tags: [config]

    - name: Configuration is valid
      ansible.builtin.command: nginx -t
      changed_when: false
      tags: [config]

    - name: nginx running at boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [config]

    # ── firewall ──────────────────────────────────────────────────────────────
    # Only ssh and the web ports from the internet; the private network is trusted so the
    # backend can be reached and so it can use this host as its route out.
    - name: Allow ssh
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port | string }}"
        proto: tcp
      tags: [firewall]

    - name: Allow http and https
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["80", "443"]
      tags: [firewall]

    - name: Trust the private network
      community.general.ufw:
        rule: allow
        src: "{{ private_cidr }}"
      tags: [firewall]

    - name: Firewall on, default deny inbound
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      tags: [firewall]

    # ── verify ────────────────────────────────────────────────────────────────
    # The whole point of the routing above is that a crawler which does not run JavaScript
    # gets the page's content. That is checked here, against the live site, and the deploy
    # FAILS if it does not hold - the previous round shipped "working" nginx while Googlebot
    # was still being handed the empty React shell, and nothing said so.
    - name: Flush pending nginx reload before verifying
      ansible.builtin.meta: flush_handlers
      tags: [config, verify]

    - name: Fetch a page the way Googlebot does
      ansible.builtin.uri:
        url: "https://{{ site_domains[0] }}/bg"
        return_content: true
        headers:
          User-Agent: >-
            Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
        timeout: 30
      register: seo_probe
      retries: 3
      delay: 5
      until: seo_probe.status is defined and seo_probe.status == 200
      tags: [config, verify]

    - name: The HTML must carry the page, not an empty shell
      ansible.builtin.assert:
        that:
          - "'<h1' in seo_probe.content"
          - "'rel=\"canonical\"' in seo_probe.content"
          - "'hreflang=' in seo_probe.content"
          - "'application/ld+json' in seo_probe.content"
          - "'<main class=\"pr\"' in seo_probe.content"
        fail_msg: >-
          https://{{ site_domains[0] }}/bg came back WITHOUT server-rendered content
          ({{ seo_probe.content | length }} bytes). Either this nginx config is not the one
          in use, or the backend could not render: check FRONTEND_SHELL on the backend host
          (deploy_frontend.yml pushes {{ app_dir | default('/opt/encar') }}/shell/index.html)
          and `journalctl -u {{ app_name }}-backend | grep prerender`.
        success_msg: "Server-rendered HTML confirmed for https://{{ site_domains[0] }}/bg"
      tags: [config, verify]

    - name: A listing that does not exist must answer 404, not 200
      ansible.builtin.uri:
        url: "https://{{ site_domains[0] }}/bg/car/00000000"
        status_code: [404, 410]
        timeout: 30
      changed_when: false
      tags: [config, verify]

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
