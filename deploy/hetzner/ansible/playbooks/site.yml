---
# Everything, in the order that never breaks: the way out first (apt and pip on the
# private-only backend host need it), then the backend, then the build, then nginx.
#
#   ansible-playbook -i inventory.ini playbooks/site.yml -e "ref=main"
- ansible.builtin.import_playbook: deploy_nat.yml
- ansible.builtin.import_playbook: deploy_backend.yml
- ansible.builtin.import_playbook: deploy_frontend.yml
- ansible.builtin.import_playbook: deploy_nginx.yml
