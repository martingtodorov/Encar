---
# The way out for back1, which has no public IPv4: the backend's own outbound connections
# (Encar, Claude, Stripe, Resend, web push) leave through front1 and the world sees front1's
# address.
#
#   ansible-playbook -i inventory.ini playbooks/deploy_nat.yml
#
# ── WHY A TUNNEL AND NOT A DEFAULT ROUTE VIA 10.0.0.2 ────────────────────────────────────
# Hetzner's private network hands each server a /32 address, so on back1 the ONLY directly
# connected neighbour is Hetzner's router 10.0.0.1. front1's 10.0.0.2 is therefore not a
# valid L2 next hop:
#     ip route replace default via 10.0.0.2       -> "Nexthop has invalid gateway"
#     ...same with `onlink`                       -> accepted, but `ip neigh` shows
#                                                    "10.0.0.2 ... FAILED" and nothing flows.
# Forcing `onlink` or hardcoding 10.0.0.2 cannot work — measured, do not retry.
#
# Instead a WireGuard point-to-point link runs OVER the private network (which works fine as
# transport): front1 10.99.0.1, back1 10.99.0.2. Inside the tunnel front1 really is directly
# connected, so it can be a gateway.
#
# ── WHAT TAKES THE TUNNEL, AND WHAT DOES NOT ─────────────────────────────────────────────
# Policy routing, never the main default route. `Table = off` on back1 keeps Hetzner's
# `default via 10.0.0.1` exactly as it is, so SSH, Ansible, apt and the private network are
# untouched and a dead tunnel cannot lock anyone out. Only packets owned by the backend
# service user are marked (mangle OUTPUT, --uid-owner) and looked up in table 100, whose
# default points into the tunnel. `throw` routes for the private network, link-local
# (169.254.169.254 metadata) and RFC1918/docker ranges make even marked traffic fall back to
# the main table.
#
# front1 forwards and MASQUERADEs 10.99.0.2/32 only. The rule lives in
# /etc/ufw/before.rules because ufw rewrites the filter AND nat tables from its own files on
# every reload, so a rule added with plain iptables disappears the next time anything
# touches the firewall. 51820/udp is opened ONLY from back1's private address to front1's
# private address — never on the public interface.
#
# Run this BEFORE deploy_backend.yml on a fresh box.
#
# Tags: gateway, client, verify.

- name: Tunnel keys on both hosts
  hosts: frontend:backend
  become: true
  # A point-to-point tunnel needs BOTH public keys. If one host is unreachable the run used
  # to carry on and die three tasks later inside a Jinja template ("object of type
  # 'HostVarsVars' has no attribute 'wg_pubkey'"), which hides the real cause — the
  # unreachable host. Stop here instead, where the error still names the host.
  any_errors_fatal: true
  tags: [gateway, client]
  # Defaults live in roles/nat_defaults/defaults/main.yml (lowest precedence, loaded at parse
  # time) — a set_fact task here was skipped by --start-at-task and left the templates with
  # undefined variables.
  roles: [nat_defaults]

  pre_tasks:
    - name: Let any first-boot apt run finish first
      ansible.builtin.include_tasks: ../tasks/wait_apt.yml
      tags: [always]

  tasks:
    - name: Are the tunnel tools already here?
      ansible.builtin.shell:
        cmd: command -v wg && command -v iptables
      register: wg_tools
      changed_when: false
      failed_when: false

    - name: WireGuard present
      # back1 has no public IPv4. Before the tunnel exists an `apt update` there does not FAIL —
      # it sits on the mirror's DNS/TCP timeout while holding the apt lock, which is what looked
      # like "someone else holds the lock". So: skip apt entirely when the tools are already on
      # the box, refresh the index only where there is a way out, and put a hard ceiling on the
      # whole step so a hung fetch becomes a named failure instead of a run that never ends.
      block:
        - name: Install wireguard, wireguard-tools, iptables
          ansible.builtin.apt:
            name: [wireguard, wireguard-tools, iptables]
            update_cache: "{{ inventory_hostname in groups['frontend'] }}"
            lock_timeout: 300
          async: 240
          poll: 10
      rescue:
        - name: Say why it could not be installed
          ansible.builtin.fail:
            msg: >-
              Installing WireGuard on {{ inventory_hostname }} did not finish within 4 minutes.
              {% if inventory_hostname in groups['backend'] %}
              back1 has no route to any mirror until the tunnel is up (and with
              nat_route_management=false, never as root). Either use an image that ships
              wireguard-tools, install it once by hand over IPv6, or bring the tunnel up first
              with `--limit frontend` and re-run.
              {% else %}
              Check apt on this host by hand: `apt-get update && apt-get install wireguard`.
              {% endif %}
      when: wg_tools.rc != 0

    - name: Key directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    - name: A private key, generated on the host and never seen by Ansible
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/wg0.key
        creates: /etc/wireguard/wg0.key

    - name: Its public half
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/wg0.key
      register: wg_pub
      changed_when: false

    - name: Remember it for the other host
      ansible.builtin.set_fact:
        wg_pubkey: "{{ wg_pub.stdout | trim }}"

- name: front1 becomes the gateway
  hosts: frontend
  become: true
  roles: [nat_defaults]

  pre_tasks:
    - name: Let any first-boot apt run finish first
      ansible.builtin.include_tasks: ../tasks/wait_apt.yml
      tags: [always]

  tasks:
    - name: ufw present
      ansible.builtin.apt:
        name: ufw
        update_cache: true
        lock_timeout: 300
      tags: [gateway]

    - name: Which interface faces the internet
      ansible.builtin.set_fact:
        public_iface: "{{ nat_public_iface | default(ansible_default_ipv4.interface) }}"
      tags: [gateway]

    - name: Forwarding on now
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        reload: true
      tags: [gateway]

    - name: Forwarding on after a reboot (ufw owns this file)
      ansible.builtin.lineinfile:
        path: /etc/ufw/sysctl.conf
        regexp: '^#?net/ipv4/ip_forward='
        line: "net/ipv4/ip_forward=1"
      notify: Reload ufw
      tags: [gateway]

    - name: ufw may forward packets
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
      notify: Reload ufw
      tags: [gateway]

    - name: Masquerade the tunnel, and nothing else
      # Narrower than the old 10.0.0.0/16 rule (removed with it, same marker): back1 is the
      # only peer, so only its tunnel address is translated.
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED: {{ app_name }} NAT"
        block: |
          *nat
          :POSTROUTING ACCEPT [0:0]
          -A POSTROUTING -s {{ wg_back_ip }}/32 -o {{ public_iface }} -j MASQUERADE
          COMMIT
      notify: Reload ufw
      tags: [gateway]

    - name: back1's public key — read from back1 now, so this play does not depend on the first
      # Facts set in play 1 exist only for the lifetime of ONE ansible-playbook process. Running
      # plays separately (--tags, --limit, a re-run after a failure) used to lose them and die
      # in the template. The key lives on the host; ask the host.
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/wg0.key
      delegate_to: "{{ groups['backend'][0] }}"
      register: peer_pub
      changed_when: false
      failed_when: false
      tags: [gateway]

    - name: Which one is used
      ansible.builtin.set_fact:
        peer_pubkey: >-
          {{ hostvars[groups['backend'][0]].wg_pubkey
             | default(peer_pub.stdout | default('') | trim, true) }}
      tags: [gateway]

    - name: back1's public key must be known before front1's peer config is written
      ansible.builtin.assert:
        that: peer_pubkey | trim | length > 0
        fail_msg: >-
          No public key from {{ groups['backend'][0] }} — /etc/wireguard/wg0.key is not there,
          so the first play never ran on it (usually UNREACHABLE). If ssh says "REMOTE HOST
          IDENTIFICATION HAS CHANGED", the box was rebuilt: run `ssh-keygen -R
          {{ hostvars[groups['backend'][0]].ansible_host | default(groups['backend'][0]) }}`
          on your laptop, ssh in once to accept the new key, then re-run this playbook.
      tags: [gateway]

    - name: Tunnel config
      ansible.builtin.template:
        src: ../templates/wg0-front.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: Restart wg0 on front1
      tags: [gateway]

    - name: Apply it before the client half runs
      ansible.builtin.meta: flush_handlers
      tags: [gateway]

    - name: Tunnel up, and up after a reboot
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      tags: [gateway]

    - name: WireGuard reachable from back1 over the private network only
      community.general.ufw:
        rule: allow
        proto: udp
        from_ip: "{{ backend_private_ip }}"
        to_ip: "{{ frontend_private_ip }}"
        to_port: "{{ wg_port }}"
        comment: "{{ app_name }} wireguard from back1"
      tags: [gateway]

    - name: WireGuard reachable from the home exit, which has no fixed address
      # WireGuard does not answer unauthenticated packets, so an open UDP port shows nothing
      # to a scanner; the peer is still admitted only by its public key.
      community.general.ufw:
        rule: allow
        proto: udp
        to_port: "{{ wg_port }}"
        comment: "{{ app_name }} wireguard from home exit"
      when: home_exit_pubkey | trim | length > 0
      tags: [gateway]

    - name: Firewall on (it must be, or none of the above is loaded)
      community.general.ufw:
        state: enabled
      tags: [gateway]

  handlers:
    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

    - name: Restart wg0 on front1
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted
        enabled: true
      failed_when: false

- name: back1 reaches the internet through the tunnel
  hosts: backend
  become: true
  roles: [nat_defaults]

  tasks:
    - name: Which interface carries the private address
      ansible.builtin.shell: >-
        ip -o -4 addr show | awk -v ip={{ backend_private_ip }}
        '$4 ~ "^"ip"/" {print $2; exit}'
      register: iface
      changed_when: false
      tags: [client]

    - name: Refuse to guess
      ansible.builtin.assert:
        that: iface.stdout | length > 0
        fail_msg: >-
          No interface holds {{ backend_private_ip }} on this host. Fix backend_private_ip in
          the inventory (it must be the address of the private network interface).
      tags: [client]

    - name: The old design is gone
      # /etc/netplan/99-<app>-nat.yaml used to put `default via 10.0.0.2` back on every
      # reboot. On Hetzner's /32 private network that route is invalid and would leave this
      # box with no way out at all.
      ansible.builtin.file:
        path: /etc/netplan/99-{{ app_name }}-nat.yaml
        state: absent
      tags: [client]

    - name: Loose reverse-path filtering survives a reboot
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-{{ app_name }}-nat.conf
        mode: "0644"
        content: |
          # Written by Ansible. Replies to tunnelled traffic arrive on wg0 while the route to
          # their source is the main table's default, which strict rp_filter would drop.
          net.ipv4.conf.all.rp_filter = 2
          net.ipv4.conf.default.rp_filter = 2
      notify: Reload sysctl
      tags: [client]

    - name: A named routing table, so `ip route show table {{ app_name }}` reads plainly
      ansible.builtin.lineinfile:
        path: /etc/iproute2/rt_tables
        line: "{{ nat_table }}\t{{ app_name }}"
        regexp: '^{{ nat_table }}\s'
        create: true
        mode: "0644"
      tags: [client]

    - name: front1's public key — read from front1 now, so this play does not depend on the first
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/wg0.key
      delegate_to: "{{ groups['frontend'][0] }}"
      register: peer_pub
      changed_when: false
      failed_when: false
      tags: [client]

    - name: Which one is used
      ansible.builtin.set_fact:
        peer_pubkey: >-
          {{ hostvars[groups['frontend'][0]].wg_pubkey
             | default(peer_pub.stdout | default('') | trim, true) }}
      tags: [client]

    - name: front1's public key must be known before back1's peer config is written
      ansible.builtin.assert:
        that: peer_pubkey | trim | length > 0
        fail_msg: >-
          No public key from {{ groups['frontend'][0] }} — /etc/wireguard/wg0.key is not there,
          so the first play never ran on it. Fix that host's ssh access and re-run; without its
          key back1 has no peer to dial.
      tags: [client]

    - name: The mark-based design is gone too
      # Tested and rejected on this host: route selection happens BEFORE mangle OUTPUT, so
      # the packet already had this host's private source when the mark moved it onto wg0 —
      # inner packets left enp7s0 with source 10.99.0.2 and front1 counted them as wg0 RX
      # errors. Selection is by UID now. Both must never be present at once.
      ansible.builtin.shell: |
        set -e
        changed=0
        if ip rule show | grep -qF 'fwmark {{ nat_mark }}'; then
          ip rule del fwmark {{ nat_mark }} lookup {{ nat_table }} || true
          changed=1
        fi
        if iptables -t mangle -C OUTPUT -m owner --uid-owner {{ backend_service_user }} \
             -j MARK --set-mark {{ nat_mark }} 2>/dev/null; then
          iptables -t mangle -D OUTPUT -m owner --uid-owner {{ backend_service_user }} \
             -j MARK --set-mark {{ nat_mark }} || true
          changed=1
        fi
        echo "$changed"
      register: mark_cleanup
      changed_when: mark_cleanup.stdout | trim == "1"
      tags: [client]

    - name: Keep a copy of the working tunnel config before replacing it
      # Rollback is `cp` plus `systemctl restart wg-quick@wg0`, and it needs a file that is
      # known to have worked, not the one Ansible is about to write.
      ansible.builtin.copy:
        src: /etc/wireguard/wg0.conf
        dest: /etc/wireguard/wg0.conf.ansible-backup
        remote_src: true
        mode: "0600"
        force: false
      failed_when: false
      tags: [client]

    - name: Tunnel config (policy routing only — the main default route is left alone)
      ansible.builtin.template:
        src: ../templates/wg0-back.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: Restart wg0 on back1
      tags: [client]

    - name: Tunnel up, and up after a reboot
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      tags: [client]

    - name: Apply any config change now
      ansible.builtin.meta: flush_handlers
      tags: [client]

    - name: A resolver that answers
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "nameserver {{ item }}"
        state: present
      loop: ["185.12.64.1", "185.12.64.2"]        # Hetzner's own resolvers
      when: not (ansible_facts.services['systemd-resolved.service'] is defined)
      failed_when: false
      tags: [client]

    - name: Hetzner's own default route is still there, untouched
      ansible.builtin.command: ip -4 route show default
      register: main_default
      changed_when: false
      tags: [client, verify]

    - name: And it does NOT point at front1
      ansible.builtin.assert:
        that:
          - main_default.stdout | length > 0
          - wg_front_ip not in main_default.stdout
          - frontend_private_ip not in main_default.stdout
        fail_msg: >-
          The main default route reads "{{ main_default.stdout }}". It must stay on Hetzner's
          gateway — replacing it is exactly the failure this playbook was rewritten to avoid.
      tags: [client, verify]

    - name: The tunnel has a handshake
      ansible.builtin.shell: wg show wg0 latest-handshakes
      register: handshake
      changed_when: false
      retries: 5
      delay: 3
      until: handshake.stdout is search('\t[1-9][0-9]+$')
      tags: [verify]

    - name: Policy rule and table
      ansible.builtin.shell: |
        set -o pipefail
        uid=$(id -u {{ backend_service_user }})
        ip rule show | grep -F "uidrange $uid-$uid"
        ip route show table {{ nat_table }}
        # The decisive check: the route the kernel picks FOR THAT UID must be the tunnel,
        # carrying the tunnel source address. This is what the mark design got wrong.
        ip route get 1.1.1.1 uid "$uid"
      args:
        executable: /bin/bash
      register: policy
      changed_when: false
      tags: [verify]

    - name: The application route really is the tunnel, with the tunnel source address
      ansible.builtin.assert:
        that:
          - "'dev wg0' in policy.stdout"
          - "'src ' ~ wg_back_ip in policy.stdout"
          - "'uidrange' in policy.stdout"
        fail_msg: >-
          Route lookup for {{ backend_service_user }} is not going down the tunnel:
          {{ policy.stdout }}
          Expected "dev wg0 src {{ wg_back_ip }}" and a uidrange rule. Roll back with
          `cp /etc/wireguard/wg0.conf.ansible-backup /etc/wireguard/wg0.conf &&
          systemctl restart wg-quick@wg0`.
      tags: [verify]

    - name: No firewall mark left anywhere
      ansible.builtin.shell: |
        set -o pipefail
        ip rule show | grep -cF 'fwmark {{ nat_mark }}' || true
      args:
        executable: /bin/bash
      register: stray_mark
      changed_when: false
      failed_when: stray_mark.stdout | trim != "0"
      tags: [verify]

    - name: Show them
      ansible.builtin.debug:
        var: policy.stdout_lines
      tags: [verify]

    - name: The application's traffic leaves through front1
      ansible.builtin.command: >-
        runuser -u {{ backend_service_user }} --
        curl -sS --max-time 20 https://ifconfig.me
      register: app_egress
      changed_when: false
      retries: 3
      delay: 3
      until: app_egress is succeeded
      tags: [verify]

    - name: It must be front1's public address
      ansible.builtin.assert:
        that: app_egress.stdout | trim == hostvars[groups['frontend'][0]].ansible_host
        fail_msg: >-
          The backend leaves as {{ app_egress.stdout }}, not front1
          ({{ hostvars[groups['frontend'][0]].ansible_host }}). Check the uidrange rule, the
          `src {{ wg_back_ip }}` on the table {{ nat_table }} default, and MASQUERADE on
          front1.
        success_msg: >-
          back1 reaches the internet as {{ app_egress.stdout }} — Stripe, Claude, Resend and
          the Encar crawl all leave through front1.
      tags: [client, verify]

    - name: No diagnostic pin left on api.encar.com
      # /etc/hosts was pinned to one CloudFront edge (3.174.46.90) while chasing the 407s.
      # That was a probe, not a fix: edges are replaced without notice, and a pinned IP that
      # goes away takes the whole catalogue with it. DNS decides again, and the client now
      # circuit-breaks on 407 instead of hammering a shut door.
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\s*[0-9.]+\s+api\.encar\.com'
        state: absent
      tags: [client]

    - name: Encar answers as the application user
      ansible.builtin.command: >-
        runuser -u {{ backend_service_user }} --
        curl -sS -o /dev/null -w '%{http_code}' --max-time 25
        'https://api.encar.com/v1/readside/vehicle/42207598'
      register: encar_probe
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Report what Encar said
      # Not fatal: a 407 here is CloudFront's decision, not a misconfiguration, and the
      # backend now degrades gracefully instead of retiring cars. But it must be VISIBLE.
      ansible.builtin.debug:
        msg: >-
          api.encar.com returned {{ encar_probe.stdout | default('nothing') }} as
          {{ backend_service_user }}.
          {{ '200 — upstream is healthy.' if encar_probe.stdout | default('') == '200'
             else 'NOT 200 — uncached car pages will serve the index-only fallback and the
             circuit breaker will hold off further calls. Nothing gets marked sold.' }}
      tags: [verify]

    - name: Where root (apt, git, pip) comes out
      ansible.builtin.command: curl -sS --max-time 20 https://ifconfig.me
      register: root_egress
      changed_when: false
      failed_when: false
      tags: [client, verify]

    - name: With nat_route_management, root must leave through front1 too
      # This host has no public IPv4: "no answer" here means deploy_backend.yml cannot clone
      # from GitHub or run apt/pip on it.
      ansible.builtin.assert:
        that: root_egress.stdout | trim == hostvars[groups['frontend'][0]].ansible_host
        fail_msg: >-
          root on back1 leaves as "{{ root_egress.stdout | default('no answer', true) }}", not
          front1. Check `ip rule show` for the second `lookup {{ nat_table }}` rule (priority
          {{ nat_rule_priority | int + 10 }}) and the resolver.
        success_msg: >-
          root leaves as {{ root_egress.stdout }} — apt, git and pip on back1 have a way out.
      when: nat_route_management | bool
      tags: [client, verify]

    - name: Say which path management traffic takes
      ansible.builtin.debug:
        msg: >-
          Management (root) traffic leaves as
          {{ root_egress.stdout | default('no answer', true) }};
          the application leaves as {{ app_egress.stdout }}.
      tags: [verify]

    - name: The home exit answers (WireGuard handshake through front1)
      ansible.builtin.command: ping -c 2 -W 3 {{ home_exit_ip }}
      register: home_ping
      changed_when: false
      retries: 5
      delay: 5
      until: home_ping.rc == 0
      when: home_exit_pubkey | trim | length > 0
      tags: [verify]

    - name: Encar through the home exit, as the application user
      ansible.builtin.command: >-
        runuser -u {{ backend_service_user }} --
        curl -sS -o /dev/null -w '%{http_code}' --max-time 25
        -x http://{{ home_exit_ip }}:{{ home_exit_proxy_port }}
        'https://api.encar.com/v1/readside/vehicle/42207598'
      register: encar_home
      changed_when: false
      failed_when: false
      when: home_exit_pubkey | trim | length > 0
      tags: [verify]

    - name: That is the whole point of the home exit, so it must be 200
      ansible.builtin.assert:
        that: encar_home.stdout | default('') == '200'
        fail_msg: >-
          api.encar.com via {{ home_exit_ip }}:{{ home_exit_proxy_port }} returned
          "{{ encar_home.stdout | default('nothing') }}". On the Mac: `sudo wg show`,
          `brew services list` (tinyproxy running?), and /opt/homebrew/var/log/tinyproxy/.
        success_msg: >-
          api.encar.com answers 200 through the home exit — the catalogue sync and car pages
          use the owner's residential address, front1 is used for everything else.
      when: home_exit_pubkey | trim | length > 0
      tags: [verify]

    - name: TLS to the services this app actually calls, through the tunnel
      ansible.builtin.command: >-
        runuser -u {{ backend_service_user }} --
        curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -I {{ item }}
      register: tls
      changed_when: false
      failed_when: tls.rc != 0
      loop:
        - https://api.stripe.com/
        - https://api.anthropic.com/
        - https://api.resend.com/
        - https://api.encar.com/
      tags: [verify]

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart wg0 on back1
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted
        enabled: true
