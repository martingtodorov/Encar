server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything under /api belongs to FastAPI.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sessions and passkeys only work over https, and the backend decides that from this
        # header — get it wrong and nobody can sign in.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Descriptions stream token by token, and a translation can take a while.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed bundles never change under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or an update never reaches anyone.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single page app: every other path is handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
