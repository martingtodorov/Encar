<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <!-- Link preview. Messenger, Viber, WhatsApp and Facebook never run our JavaScript, so
             the og:* tags src/lib/seo.js writes at runtime are invisible to them: whatever is
             HERE is the preview for every shared URL. og.png is our own logo on the brand
             plate at 1200x630. A car link previewed with the ad's own photo needs the server
             to answer the URL (nginx sends crawlers to /api/share/car/{id}); this is the
             fallback and it must never be empty. -->
        <meta property="og:site_name" content="Europe Encar" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Korean cars with a final landed price | Encar Europe" />
        <meta property="og:description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <meta property="og:image" content="%REACT_APP_SITE_URL%/og.png" />
        <meta property="og:image:secure_url" content="%REACT_APP_SITE_URL%/og.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Europe Encar" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Korean cars with a final landed price | Encar Europe" />
        <meta name="twitter:description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <meta name="twitter:image" content="%REACT_APP_SITE_URL%/og.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" sizes="256x256" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-180.png" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <!-- The default title and description a crawler sees before React boots. Per-page SEO
             is set by lib/seo.js; this is the fallback and it must say what the site IS. -->
        <title>Korean cars with a final landed price | Encar Europe</title>
        <!-- The title and description below are the ENGLISH defaults, and they are what a
             deep route (/bg/car/123) is served. scripts/gen-lang-html.js (postbuild) injects a
             tiny script after </title> that rewrites them from the URL's language, and writes
             build/bg|ro|en/index.html with the translated tags baked in for the landing pages.
             The copy lives in scripts/seo-landing.json. -->

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- No analytics or session-recording script is loaded here on purpose.
             Anything that is not strictly necessary must wait for the visitor to agree
             to the "Statistics" category in the cookie banner, so trackers are loaded
             from src/lib/analytics.js AFTER consent - never from this file, which runs
             before the app (and therefore before any consent) exists. -->
    </body>
</html>
