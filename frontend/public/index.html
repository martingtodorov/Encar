<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <!-- Link preview fallback. Messenger, Viber, WhatsApp and Facebook never run our
             JavaScript, so the og:* tags src/lib/seo.js writes at runtime are invisible to
             them. Crawlers hitting a car link are routed by nginx to /api/share/car/{id}
             where the ad's own lead photo is written into a clean, Encar-style head - this
             shell is only the fallback for pages we do not SSR (the landing and the search).
             The og:image:* companion tags (secure_url/width/height/alt) and twitter:image
             used to live here too, and because seo.js only upserted og:image at runtime the
             companion tags kept pointing at the logo on a car page and leaked into iOS
             Safari's share sheet. One og:image is the ONLY image tag; nothing companions it. -->
        <meta property="og:site_name" content="Europe Encar" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Korean cars with a final landed price | Encar Europe" />
        <meta property="og:description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <meta property="og:image" content="%REACT_APP_SITE_URL%/og.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Korean cars with a final landed price | Encar Europe" />
        <meta name="twitter:description" content="Browse every Encar listing in English, Bulgarian and Romanian with a final price that includes customs duty, VAT, sea freight and delivery." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Every single car card and every car detail page loads its photos DIRECTLY
             from Encar's CDN (ci.encar.com); a preconnect here saves the TLS handshake
             and DNS round trip on the very first image request. Lighthouse flagged it
             as one of the biggest LCP wins for the search grid. -->
        <link rel="preconnect" href="https://ci.encar.com" crossorigin />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" sizes="256x256" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-180.png" />
        <!-- Google Fonts CSS is loaded asynchronously so it never blocks the first paint.
             The link starts as `preload as="style"` (fetched with the highest priority but
             NOT applied to the page), then onload flips its rel to "stylesheet" and the
             font styles kick in. The <noscript> fallback keeps things working with JS off.
             Lighthouse counted the render-blocking Google Fonts fetch as ~1200 ms on
             mobile - biggest single win on the LCP path. -->
        <link
          rel="preload"
          as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap"
          onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        </noscript>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <!-- The default title and description a crawler sees before React boots. Per-page SEO
             is set by lib/seo.js; this is the fallback and it must say what the site IS. -->
        <title>Korean cars with a final landed price | Encar Europe</title>
        <!-- The title and description below are the ENGLISH defaults, and they are what a
             deep route (/bg/car/123) is served. scripts/gen-lang-html.js (postbuild) injects a
             tiny script after </title> that rewrites them from the URL's language, and writes
             build/bg|ro|en/index.html with the translated tags baked in for the landing pages.
             The copy lives in scripts/seo-landing.json. -->

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- Third-party badge/telemetry script from the Emergent platform is deferred so
             it never blocks the initial render. Lighthouse counted this at ~770 ms on the
             critical path; `defer` runs it after DOMContentLoaded, which is fine for a
             non-essential badge. -->
        <script src="https://assets.emergent.sh/scripts/emergent-main.js" defer></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- No analytics or session-recording script is loaded here on purpose.
             Anything that is not strictly necessary must wait for the visitor to agree
             to the "Statistics" category in the cookie banner, so trackers are loaded
             from src/lib/analytics.js AFTER consent - never from this file, which runs
             before the app (and therefore before any consent) exists. -->
    </body>
</html>
